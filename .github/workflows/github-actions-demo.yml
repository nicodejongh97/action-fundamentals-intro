name: GitHub Actions Demo

run-name: testing my first workflow

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/**
  pull_request:
    branches:
      - main
  schedule:
    - cron: "15 6 * * 0"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Event name that triggered the workflow: $EVENT_NAME"
          echo "Branch: $REF, repository: $REPOSITORY."
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: List files in the repository
        run: |
          echo "The repository $REPOSITORY contains the following files:"
          tree
        env:
          REPOSITORY: ${{ github.repository }}
