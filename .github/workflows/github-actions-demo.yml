name: GitHub Actions Demo

run-name: testing my first workflow

permissions:
  contents: read

cache-mode: none

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/**
  pull_request:
    branches:
      - main
  schedule:
    - cron: "15 6 * * 0"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        type: environment
        required: true
        
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Event name that triggered the workflow: $EVENT_NAME"
          echo "Branch: $REF, repository: $REPOSITORY."
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: List files in the repository
        run: |
          echo "The repository $REPOSITORY contains the following files:"
          tree
        env:
          REPOSITORY: ${{ github.repository }}
          
  test:
    runs-on: 
      - ubuntu-26.04
    needs:
      - build
    if: github.event_name == 'workflow_dispatch'
    environment: Test
    steps:
      - name: Run Test
        run: |
          echo "Testing..."
          
  load-test:
    runs-on: ubuntu-26.04
    needs: build
    if: github.event_name == 'workflow_dispatch'
    environment: Load-Test
    steps:
      - run: |
          echo "🧪 Testing..."
          sleep 15

  production:
    runs-on: ubuntu-26.04
    needs:
      - test
      - load-test
    environment:
      name: Production
      url: https://writeabout.net
    if: inputs.environment == 'Production'
    steps:
      - run: |
          echo "🚀 Step 1 deploying..."
          sleep 10
      - run: |
          echo "🚀 Step 2 deploying..."
          sleep 10
      - run: |
          echo "🚀 Step 3 deploying..."
          sleep 10
      - run: |
          echo "🚀 Step 4 deploying..."
          sleep 10
      - run: |
          echo "🚀 Step 5 deploying..."
          sleep 10
