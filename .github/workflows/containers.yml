name: container

run-name: run-name container

on:
  workflow_dispatch: 

jobs:
  step-container:
    runs-on: ubuntu-latest
    steps:
      - name: On the runner (running ubuntu)
        run: cat /etc/os-release
      - name: In an Alpine container
        uses: docker://alpine:3.22
        with:
          entrypoint: /bin/sh
          args: -c "cat /etc/os-release"
      
    
