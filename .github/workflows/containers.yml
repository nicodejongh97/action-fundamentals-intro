name: container

run-name: run-name container

on:
  workflow_dispatch: 

jobs:
  step-container:
    runs-on: ubuntu-latest
    steps:
      - name: On the runner (running ubuntu)
        run: cat /etc/os-release
      - name: In an Alpine container
        uses: docker://alpine:3.22
        with:
          entrypoint: /bin/sh
          args: -c "cat /etc/os-release"
  job-container:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm-slim
      env:
        MY_SETTING: from-the-container-block
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - run: |
          node --version
          cat /etc/os-release
          echo "MY_SETTING=$MY_SETTING"
